name: release

# A tag is the release candidate and a dispatch is the dry run; both call the organisation's
# reusable workflow, which holds the steps and says what each one holds and why.
#
# WHAT EACH TRIGGER CAN DO
#
#   tag push    A rehearsal: the reusable workflow takes the version from the tag and refuses a tag
#               that is not vMAJOR.MINOR.PATCH or is not on the default branch.
#   dispatch    A rehearsal of the same build at the version typed, from any branch.
#
# Both run the build job only: a throwaway signing key, every gate, a run artifact. `upload` and
# `target` are fixed below and no secret is passed, so the job that uploads cannot run and nothing
# leaves the runner. Publishing is a change to this file, made in review: it sets the target the
# capability's licence calls for (`central` or `github-packages`) and passes the release secrets.
#
# The permissions are the union of the jobs the reusable workflow declares; GitHub rejects a caller
# that grants less. The job that holds the secrets cannot write provenance, and the job that writes
# provenance runs no project code.

on:
  push:
    tags:
      # Permissive on purpose: the strict check is a step in the reusable workflow, not this filter.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a DRY RUN (e.g. 0.1.0), MAJOR.MINOR.PATCH, never -SNAPSHOT'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: exeris-systems/.github/.github/workflows/caps-release.yml@main
    with:
      version: ${{ inputs.version }}
      # Fixed, not inputs: this repository can only rehearse a release. Uploading needs a change to
      # this file that sets a target and passes the release secrets, which is reviewed like any other.
      upload: false
      target: none
