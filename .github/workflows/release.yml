name: release

# A tag is the release candidate and a dispatch is the dry run; both call the organisation's
# reusable workflow, which holds the steps and says what each one holds and why.
#
# THE REUSABLE WORKFLOW HAS FOUR JOBS
#
#   build    Always runs. Builds with `-P release`, signs with a throwaway key generated in the job,
#            runs every gate and keeps what it gated as a run artifact.
#   publish  Runs only when `upload` is true and `target` is not `none`. Rebuilds and signs with the
#            real key, from the two signing secrets, and stages the gated files.
#   upload   The only job with `packages: write`. Sends the staged files to GitHub Packages.
#   attest   Writes provenance for what was uploaded.
#
# WHAT EACH TRIGGER CAN DO
#
#   tag push    A release: the reusable workflow takes the version from the tag, refuses a tag that
#               is not vMAJOR.MINOR.PATCH, is not on the default branch or does not match the
#               version in the POM, and then runs all four jobs. The files it gated are uploaded to
#               GitHub Packages under this repository and attested. A released version cannot be
#               uploaded again: the registry refuses it and the run fails.
#   dispatch    A rehearsal of the same build at the version typed, from any branch: the build job
#               only, with a throwaway signing key. Nothing leaves the runner.
#
# `upload` is true for a tag push and false for a dispatch; it is not an input, so a dispatch cannot
# upload. The two signing secrets are passed for both triggers and are read by `publish` alone,
# which a rehearsal does not run.
#
# The permissions are the union of what the four jobs declare; GitHub rejects a caller that grants
# less. The JDK is the reusable workflow's default, Temurin 25, which is the baseline this
# repository's build workflow compiles for.

on:
  push:
    tags:
      # Permissive on purpose: the strict check is a step in the reusable workflow, not this filter.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a DRY RUN (e.g. 0.1.0), MAJOR.MINOR.PATCH, never -SNAPSHOT'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: exeris-systems/.github/.github/workflows/caps-release.yml@main
    with:
      version: ${{ inputs.version }}
      # Not inputs: only a tag push uploads, and only to GitHub Packages.
      upload: ${{ github.event_name == 'push' }}
      target: github-packages
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
